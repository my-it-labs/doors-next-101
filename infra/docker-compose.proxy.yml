# Overlay EXPERIMENTAL: añade un reverse proxy nginx que reescribe la URI pública
# fija de DOORS (localhost:9443) al dominio del proxy de Codespaces, para intentar
# servir DOORS por la URL *.app.github.dev sin túnel a localhost.
#
# No toca la vía localhost (puerto 9443 directo de 'doors' sigue igual).
# Uso:  bash infra/up-proxy.sh   (calcula PROXY_DOMAIN y levanta el stack + proxy)
services:
  proxy:
    image: nginx:alpine
    container_name: doors-proxy
    depends_on:
      - doors
    ports:
      - "8443:8443"
    environment:
      - PROXY_DOMAIN=${PROXY_DOMAIN:?define PROXY_DOMAIN antes de levantar (usa up-proxy.sh)}
      - NGINX_ENVSUBST_FILTER=PROXY_DOMAIN
    volumes:
      - ./proxy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    restart: unless-stopped
